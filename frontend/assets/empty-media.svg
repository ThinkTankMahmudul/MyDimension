    <path d="M185 140 C185 115 200 105 220 105 C240 105 255 115 255 140 Z" fill="#245C49"/>
    <line x1="220" y1="105" x2="220" y2="94" stroke="#245C49" stroke-width="2.5"/>
    <path transform="translate(220 88)" d="M0 -6 A6 6 0 1 0 0 6 A5 5 0 1 1 0 -6 Z" fill="#14B8A6"/>
    <rect x="140" y="112" width="8" height="68" fill="#0F766E"/>
