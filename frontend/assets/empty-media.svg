  </defs>
  <rect width="440" height="220" rx="16" fill="url(#emptySky)"/>

  <!-- crescent moon and stars -->
  <circle cx="330" cy="62" r="20" fill="#14B8A6" opacity=".3"/>
  <circle cx="330" cy="62" r="15" fill="#14B8A6"/>
  <circle cx="337" cy="56" r="12" fill="#DCE9F2"/>
