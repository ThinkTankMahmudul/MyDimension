  <!-- arch frame -->
  <path d="M40 200 V90 Q40 30 220 30 Q400 30 400 90 V200" fill="none" stroke="#0F766E" stroke-width="6"/>
  <path d="M54 200 V90 Q54 44 220 44 Q386 44 386 90 V200" fill="none" stroke="#14B8A6" stroke-width="2.5" opacity=".7"/>
