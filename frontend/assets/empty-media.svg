<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-label="Empty media vault illustration with a ringed planet, a photo and a music note">
  <defs>
    <linearGradient id="emptySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4FAF5"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="440" height="220" rx="16" fill="url(#emptySky)"/>

  <!-- crescent moon and stars -->
  <circle cx="330" cy="62" r="20" fill="#14B8A6" opacity=".3"/>
  <circle cx="330" cy="62" r="15" fill="#14B8A6"/>
  <circle cx="337" cy="56" r="12" fill="#DCE9F2"/>
  <g fill="#0F766E">
    <circle cx="90" cy="48" r="2"/><circle cx="140" cy="34" r="1.6"/><circle cx="380" cy="40" r="2"/>
    <circle cx="60" cy="90" r="1.6"/><circle cx="395" cy="100" r="1.8"/>
  </g>
  <g fill="#FFFFFF" opacity=".9">
    <ellipse cx="120" cy="70" rx="34" ry="8"/><ellipse cx="250" cy="52" rx="28" ry="7"/>
  </g>

  <!-- ringed planet -->
  <g>
    <circle cx="220" cy="118" r="38" fill="#14B8A6"/>
    <circle cx="206" cy="106" r="7" fill="#0F766E" opacity=".55"/>
    <circle cx="234" cy="128" r="5" fill="#0F766E" opacity=".45"/>
    <ellipse cx="220" cy="118" rx="60" ry="13" fill="none" stroke="#AFA0E8" stroke-width="5" transform="rotate(-14 220 118)"/>
  </g>

  <!-- rolling hills -->
  <path d="M0 180 Q110 160 220 175 T440 170 V220 H0 Z" fill="#AFA0E8" opacity=".5"/>
  <path d="M0 196 Q150 180 300 192 T440 190 V220 H0 Z" fill="#EDE9FE"/>

  <!-- photo frame and music note -->
  <g>
    <rect x="36" y="148" width="56" height="44" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5"/>
    <circle cx="76" cy="162" r="5" fill="#A7F3D0"/>
    <path d="M40 188 L60 168 L74 180 L84 170 L88 174 V188 Z" fill="#14B8A6"/>
  </g>
  <g fill="#0F766E">
    <ellipse cx="352" cy="168" rx="9" ry="6.5" transform="rotate(-15 352 168)"/>
    <rect x="359" y="126" width="4.5" height="42"/>
    <path d="M363 126 q16 4 13 18 q-2 -9 -13 -11 Z"/>
  </g>

  <!-- open book on the hill -->
  <g>
    <path d="M180 196 Q200 188 220 196 V208 Q200 200 180 208 Z" fill="#FFFFFF"/>
    <path d="M220 196 Q240 188 260 196 V208 Q240 200 220 208 Z" fill="#EDE9FE"/>
    <line x1="220" y1="196" x2="220" y2="208" stroke="#0F766E" stroke-width="1.5"/>
  </g>

  <!-- soft rounded frame -->
  <rect x="10" y="10" width="420" height="200" rx="14" fill="none" stroke="#0F766E" stroke-width="4" opacity=".35"/>
  <rect x="20" y="20" width="400" height="180" rx="10" fill="none" stroke="#14B8A6" stroke-width="2" opacity=".5"/>
</svg>
