<svg xmlns="http://www.w3.org/2000/svg" width="320" height="640" viewBox="-16 -16 352 672" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A pencil drawing a winding path over layered hills">
  <!-- MyDimension palette only: teal, mint, sand, peach, charcoal. -->
  <!-- Sun -->
  <circle cx="66" cy="86" r="30" fill="#FDE68A"/>
  <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round" opacity=".65">
    <path d="M66 40v-12M66 132v12M20 86H8M112 86h12M34 54l-9-9M98 54l9-9"/>
  </g>
  <!-- Small stars / dots -->
  <g fill="#0F766E">
    <circle cx="150" cy="60" r="3"/><circle cx="200" cy="110" r="2.5"/><circle cx="120" cy="150" r="2"/>
    <path d="M268 60l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
  </g>
  <!-- Pencil, tip down, drawing the path (right edge, like the Keep note) -->
  <g transform="rotate(7 245 300)">
    <rect x="218" y="46" width="54" height="26" rx="6" fill="#F9A8D4"/>
    <rect x="218" y="72" width="54" height="18" fill="#A7F3D0"/>
    <rect x="218" y="90" width="54" height="300" rx="8" fill="#14B8A6"/>
    <rect x="232" y="90" width="7" height="300" fill="#0F766E" opacity=".55"/>
    <rect x="251" y="90" width="7" height="300" fill="#A7F3D0" opacity=".8"/>
    <path d="M218 390h54l-27 64z" fill="#FDE68A"/>
    <path d="M236 424h18l-9 30z" fill="#26352F"/>
  </g>
  <!-- Winding path drawn by the pencil tip -->
  <path d="M245 462 C 210 520, 130 505, 105 555 S 70 610, 55 640" fill="none" stroke="#0F766E" stroke-width="13" stroke-linecap="round"/>
  <path d="M245 462 C 210 520, 130 505, 105 555 S 70 610, 55 640" fill="none" stroke="#14B8A6" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/>
  <!-- Layered hills at the bottom -->
  <path d="M0 556 Q 80 516 160 556 T 320 556 V 640 H 0 Z" fill="#FDE68A" opacity=".85"/>
  <path d="M0 592 Q 90 558 180 592 T 320 592 V 640 H 0 Z" fill="#FED7AA"/>
  <!-- Grass tufts -->
  <g stroke="#0F766E" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M40 606v-14M48 606l6-12M56 606v-10"/>
    <path d="M270 620v-14M278 620l6-12M286 620v-10"/>
  </g>
</svg>
