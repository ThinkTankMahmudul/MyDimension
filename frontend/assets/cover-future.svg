<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hot-air balloon over green mountains at dawn">
  <defs>
    <linearGradient id="futureSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset=".55" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#E4FAF5"/>
    </linearGradient>
    <pattern id="futureGeo" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M28 7 L34 22 L49 28 L34 34 L28 49 L22 34 L7 28 L22 22 Z" fill="none" stroke="#0F766E" stroke-opacity=".5" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="5" fill="none" stroke="#0F766E" stroke-opacity=".4" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#futureSky)"/>
  <rect width="800" height="480" fill="url(#futureGeo)" opacity=".12"/>

  <!-- dawn sun -->
  <circle cx="400" cy="140" r="95" fill="#FFFFFF" opacity=".5"/>
  <g stroke="#14B8A6" stroke-width="4" stroke-linecap="round" opacity=".55">
    <line x1="400" y1="58" x2="400" y2="38"/><line x1="400" y1="222" x2="400" y2="242"/>
    <line x1="318" y1="140" x2="298" y2="140"/><line x1="482" y1="140" x2="502" y2="140"/>
    <line x1="342" y1="82" x2="328" y2="68"/><line x1="458" y1="82" x2="472" y2="68"/>
    <line x1="342" y1="198" x2="328" y2="212"/><line x1="458" y1="198" x2="472" y2="212"/>
  </g>
  <circle cx="400" cy="140" r="56" fill="#A7F3D0"/>
  <circle cx="400" cy="140" r="56" fill="none" stroke="#14B8A6" stroke-width="3" opacity=".6"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity=".9">
    <ellipse cx="140" cy="110" rx="64" ry="14"/><ellipse cx="180" cy="100" rx="40" ry="12"/>
    <ellipse cx="640" cy="90" rx="70" ry="14"/><ellipse cx="600" cy="80" rx="38" ry="11"/>
    <ellipse cx="330" cy="210" rx="56" ry="11" opacity=".7"/>
  </g>
  <!-- birds -->
  <g fill="none" stroke="#245C49" stroke-width="2.5" stroke-linecap="round">
    <path d="M250 90 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M520 70 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M580 120 q5 -5 10 0 q5 -5 10 0"/>
  </g>

  <!-- paper plane -->
  <g>
    <path d="M620 200 L690 178 L648 232 Z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M648 232 L690 178 L656 210 Z" fill="#A7F3D0"/>
    <path d="M560 214 Q590 200 618 202" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="5 6" opacity=".6"/>
  </g>

  <!-- mountains -->
  <path d="M-20 480 L170 250 L360 480 Z" fill="#245C49"/>
  <path d="M150 278 L170 250 L192 282 L178 278 L170 290 L158 276 Z" fill="#FFFFFF"/>
  <path d="M440 480 L620 230 L800 480 Z" fill="#0F766E"/>
  <path d="M598 262 L620 230 L644 264 L628 258 L620 272 L606 258 Z" fill="#FFFFFF"/>
  <path d="M240 480 L400 330 L560 480 Z" fill="#12B89A" opacity=".85"/>

  <!-- hot-air balloon -->
  <g>
    <circle cx="400" cy="212" r="58" fill="#14B8A6"/>
    <path d="M400 154 a58 58 0 0 1 0 116 a20 58 0 0 1 0 -116 Z" fill="#0F766E"/>
    <path d="M400 154 a58 58 0 0 0 0 116 a20 58 0 0 0 0 -116 Z" fill="#A7F3D0" opacity=".8"/>
    <ellipse cx="378" cy="188" rx="10" ry="16" fill="#FFFFFF" opacity=".55"/>
    <line x1="362" y1="258" x2="382" y2="296" stroke="#26352F" stroke-width="2.5"/>
    <line x1="438" y1="258" x2="418" y2="296" stroke="#26352F" stroke-width="2.5"/>
    <line x1="400" y1="270" x2="400" y2="296" stroke="#26352F" stroke-width="2.5"/>
    <rect x="380" y="296" width="40" height="30" rx="6" fill="#26352F"/>
    <rect x="386" y="304" width="28" height="5" rx="2.5" fill="#A7F3D0"/>
  </g>

  <!-- rolling hills -->
  <path d="M0 410 Q250 360 500 400 T800 390 V480 H0 Z" fill="#EDE9FE"/>
  <path d="M0 440 Q260 400 520 428 T800 424 V480 H0 Z" fill="#AFA0E8" opacity=".45"/>

  <!-- small trees on the hills -->
  <g fill="#245C49">
    <path d="M90 420 L104 388 L118 420 Z"/><rect x="101" y="420" width="6" height="12"/>
    <path d="M690 416 L704 384 L718 416 Z"/><rect x="701" y="416" width="6" height="12"/>
  </g>
</svg>
