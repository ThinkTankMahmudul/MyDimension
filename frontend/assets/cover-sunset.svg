<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sailboat on calm water at sunset">
  <defs>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AFA0E8"/>
      <stop offset=".55" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#sunsetSky)"/>

  <!-- stars appearing in the dusk sky -->
  <g fill="#FFFFFF" opacity=".75">
    <circle cx="80" cy="60" r="2"/><circle cx="180" cy="40" r="1.5"/><circle cx="300" cy="70" r="2"/>
    <circle cx="520" cy="45" r="1.5"/><circle cx="720" cy="50" r="2"/><circle cx="120" cy="120" r="1.5"/>
  </g>
  <!-- crescent moon -->
  <circle cx="640" cy="80" r="34" fill="#A7F3D0" opacity=".35"/>
  <circle cx="640" cy="80" r="26" fill="#A7F3D0"/>
  <circle cx="650" cy="72" r="22" fill="#9B8FD0"/>

  <!-- low sun -->
  <circle cx="400" cy="290" r="90" fill="#FFFFFF" opacity=".3"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".6">
    <line x1="400" y1="212" x2="400" y2="196"/><line x1="322" y1="290" x2="306" y2="290"/>
    <line x1="478" y1="290" x2="494" y2="290"/><line x1="345" y1="235" x2="334" y2="224"/>
    <line x1="455" y1="235" x2="466" y2="224"/>
  </g>
  <circle cx="400" cy="290" r="52" fill="#FFFFFF"/>
  <circle cx="400" cy="290" r="52" fill="none" stroke="#EDE9FE" stroke-width="3"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity=".35">
    <ellipse cx="150" cy="170" rx="70" ry="13"/><ellipse cx="650" cy="180" rx="76" ry="13"/>
  </g>
  <!-- birds -->
  <g fill="none" stroke="#26352F" stroke-width="2.5" stroke-linecap="round">
    <path d="M220 130 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M540 110 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- distant hills -->
  <path d="M0 380 Q220 330 420 368 T800 356 V480 H0 Z" fill="#AFA0E8" opacity=".6"/>
  <path d="M0 420 Q260 380 520 408 T800 400 V480 H0 Z" fill="#EDE9FE" opacity=".85"/>

  <!-- calm water -->
  <rect x="0" y="400" width="800" height="80" fill="#0F766E" opacity=".55"/>
  <g stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" opacity=".7">
    <line x1="80" y1="428" x2="150" y2="428"/><line x1="560" y1="440" x2="660" y2="440"/>
    <line x1="180" y1="452" x2="260" y2="452"/><line x1="620" y1="462" x2="700" y2="462"/>
  </g>

  <!-- sailboat -->
  <g>
    <line x1="400" y1="238" x2="400" y2="392" stroke="#26352F" stroke-width="5"/>
    <path d="M408 250 L408 372 L478 372 Z" fill="#FFFFFF"/>
    <path d="M392 268 L392 372 L330 372 Z" fill="#EDE9FE"/>
    <path d="M330 392 L470 392 L448 420 L352 420 Z" fill="#26352F"/>
    <path d="M400 238 L418 250 L400 254 Z" fill="#14B8A6"/>
    <path d="M330 392 L470 392 L448 420 L352 420 Z" fill="none" stroke="#A7F3D0" stroke-width="2"/>
  </g>

  <!-- pine trees on the shore -->
  <g fill="#245C49">
    <path d="M96 400 L112 356 L128 400 Z"/><rect x="109" y="400" width="6" height="12"/>
    <path d="M676 398 L692 354 L708 398 Z"/><rect x="689" y="398" width="6" height="12"/>
  </g>
</svg>
