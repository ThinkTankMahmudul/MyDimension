<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mosque arch at sunset">
  <defs>
    <linearGradient id="sunsetSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AFA0E8"/>
      <stop offset=".55" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#sunsetSky)"/>

  <!-- stars appearing in the dusk sky -->
  <g fill="#FFFFFF" opacity=".75">
    <circle cx="80" cy="60" r="2"/><circle cx="180" cy="40" r="1.5"/><circle cx="300" cy="70" r="2"/>
    <circle cx="520" cy="45" r="1.5"/><circle cx="720" cy="50" r="2"/><circle cx="120" cy="120" r="1.5"/>
  </g>
  <!-- crescent moon -->
  <circle cx="640" cy="80" r="34" fill="#A7F3D0" opacity=".35"/>
  <circle cx="640" cy="80" r="26" fill="#A7F3D0"/>
  <circle cx="650" cy="72" r="22" fill="#9B8FD0"/>

  <!-- low sun -->
  <circle cx="400" cy="290" r="90" fill="#FFFFFF" opacity=".3"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".6">
    <line x1="400" y1="212" x2="400" y2="196"/><line x1="322" y1="290" x2="306" y2="290"/>
    <line x1="478" y1="290" x2="494" y2="290"/><line x1="345" y1="235" x2="334" y2="224"/>
    <line x1="455" y1="235" x2="466" y2="224"/>
  </g>
  <circle cx="400" cy="290" r="52" fill="#FFFFFF"/>
  <circle cx="400" cy="290" r="52" fill="none" stroke="#EDE9FE" stroke-width="3"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity=".35">
    <ellipse cx="150" cy="170" rx="70" ry="13"/><ellipse cx="650" cy="180" rx="76" ry="13"/>
  </g>

  <!-- dunes -->
  <path d="M0 380 Q220 330 420 368 T800 356 V480 H0 Z" fill="#AFA0E8" opacity=".6"/>
  <path d="M0 420 Q260 380 520 408 T800 400 V480 H0 Z" fill="#EDE9FE" opacity=".85"/>

  <!-- mosque silhouette inside the great arch -->
  <g>
    <rect x="210" y="350" width="380" height="60" fill="#26352F"/>
    <rect x="350" y="330" width="100" height="20" fill="#26352F"/>
    <path d="M320 350 C320 275 355 240 400 240 C445 240 480 275 480 350 Z" fill="#245C49"/>
    <line x1="400" y1="240" x2="400" y2="218" stroke="#A7F3D0" stroke-width="3"/>
    <path transform="translate(400 210)" d="M0 -8 A8 8 0 1 0 0 8 A6.5 6.5 0 1 1 0 -8 Z" fill="#A7F3D0"/>
    <path d="M245 350 C245 312 262 294 280 294 C298 294 315 312 315 350 Z" fill="#245C49"/>
    <path d="M485 350 C485 312 502 294 520 294 C538 294 555 312 555 350 Z" fill="#245C49"/>
    <rect x="180" y="230" width="20" height="180" fill="#26352F"/>
    <rect x="172" y="306" width="36" height="10" fill="#26352F"/>
    <path d="M180 230 Q190 200 200 230 Z" fill="#245C49"/>
    <line x1="190" y1="200" x2="190" y2="184" stroke="#A7F3D0" stroke-width="2.5"/>
    <rect x="600" y="230" width="20" height="180" fill="#26352F"/>
    <rect x="592" y="306" width="36" height="10" fill="#26352F"/>
    <path d="M600 230 Q610 200 620 230 Z" fill="#245C49"/>
    <line x1="610" y1="200" x2="610" y2="184" stroke="#A7F3D0" stroke-width="2.5"/>
    <g fill="#A7F3D0" opacity=".95">
      <path d="M240 410 L240 382 A9 11 0 0 1 258 382 L258 410 Z"/>
      <path d="M310 410 L310 382 A9 11 0 0 1 328 382 L328 410 Z"/>
      <path d="M472 410 L472 382 A9 11 0 0 1 490 382 L490 410 Z"/>
      <path d="M542 410 L542 382 A9 11 0 0 1 560 382 L560 410 Z"/>
      <path d="M385 410 L385 368 A15 18 0 0 1 415 368 L415 410 Z"/>
    </g>
  </g>

  <!-- lantern on the dune -->
  <g>
    <circle cx="700" cy="428" r="24" fill="#A7F3D0" opacity=".35"/>
    <path d="M692 416 h16 l-3 24 h-10 Z" fill="#26352F"/>
    <path d="M694 416 Q700 406 706 416 Z" fill="#26352F"/>
    <rect x="698" y="412" width="4" height="5" fill="#26352F"/>
  </g>

  <!-- great mosque arch framing the scene -->
  <path d="M60 480 V220 Q60 90 400 90 Q740 90 740 220 V480" fill="none" stroke="#245C49" stroke-width="28"/>
  <path d="M86 480 V220 Q86 116 400 116 Q714 116 714 220 V480" fill="none" stroke="#A7F3D0" stroke-width="3" opacity=".8"/>
</svg>
