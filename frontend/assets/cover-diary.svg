<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mosque under a crescent moon at night">
  <defs>
    <linearGradient id="diarySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2530"/>
      <stop offset=".55" stop-color="#0F4C5C"/>
      <stop offset="1" stop-color="#146B5E"/>
    </linearGradient>
    <radialGradient id="diaryMoonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="diaryGeo" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 6 L29 19 L42 24 L29 29 L24 42 L19 29 L6 24 L19 19 Z" fill="none" stroke="#14B8A6" stroke-opacity=".35" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="4" fill="none" stroke="#14B8A6" stroke-opacity=".3" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#diarySky)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="40" r="1.5"/><circle cx="200" cy="80" r="2.5"/>
    <circle cx="280" cy="50" r="1.5"/><circle cx="360" cy="70" r="2"/><circle cx="470" cy="45" r="2.5"/>
    <circle cx="540" cy="90" r="1.5"/><circle cx="700" cy="140" r="2"/><circle cx="750" cy="60" r="2.5"/>
    <circle cx="90" cy="140" r="1.5"/><circle cx="320" cy="120" r="1.8"/><circle cx="580" cy="60" r="1.5"/>
    <circle cx="680" cy="200" r="1.8"/><circle cx="40" cy="220" r="1.5"/><circle cx="760" cy="260" r="1.5"/>
  </g>
  <g fill="#A7F3D0">
    <path transform="translate(150 110)" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/>
    <path transform="translate(430 60)" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/>
    <path transform="translate(590 150)" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
  </g>

  <!-- crescent moon -->
  <circle cx="640" cy="95" r="62" fill="url(#diaryMoonGlow)"/>
  <circle cx="640" cy="95" r="40" fill="#A7F3D0"/>
  <circle cx="656" cy="82" r="34" fill="#0D3D4C"/>

  <!-- soft clouds -->
  <g fill="#CFE8DC">
    <ellipse cx="150" cy="150" rx="70" ry="14" opacity=".07"/>
    <ellipse cx="520" cy="120" rx="80" ry="16" opacity=".06"/>
    <ellipse cx="350" cy="200" rx="60" ry="12" opacity=".05"/>
  </g>

  <!-- mosque silhouette -->
  <g>
    <rect x="170" y="340" width="460" height="70" fill="#0A2E2A"/>
    <rect x="335" y="320" width="130" height="20" fill="#0A2E2A"/>
    <path d="M300 340 C300 255 345 215 400 215 C455 215 500 255 500 340 Z" fill="#0D3B33"/>
    <line x1="400" y1="215" x2="400" y2="192" stroke="#14B8A6" stroke-width="3"/>
    <path transform="translate(400 184)" d="M0 -8 A8 8 0 1 0 0 8 A6.5 6.5 0 1 1 0 -8 Z" fill="#14B8A6"/>
    <path d="M215 340 C215 295 235 275 255 275 C275 275 295 295 295 340 Z" fill="#0D3B33"/>
    <path d="M505 340 C505 295 525 275 545 275 C565 275 585 295 585 340 Z" fill="#0D3B33"/>
    <!-- minarets -->
    <rect x="140" y="210" width="20" height="200" fill="#0A2E2A"/>
    <rect x="132" y="290" width="36" height="10" fill="#0A2E2A"/>
    <path d="M140 210 Q150 180 160 210 Z" fill="#0D3B33"/>
    <line x1="150" y1="180" x2="150" y2="162" stroke="#14B8A6" stroke-width="2.5"/>
    <rect x="640" y="210" width="20" height="200" fill="#0A2E2A"/>
    <rect x="632" y="290" width="36" height="10" fill="#0A2E2A"/>
    <path d="M640 210 Q650 180 660 210 Z" fill="#0D3B33"/>
    <line x1="650" y1="180" x2="650" y2="162" stroke="#14B8A6" stroke-width="2.5"/>
    <!-- glowing arched windows and door -->
    <g fill="#A7F3D0" opacity=".85">
      <path d="M200 410 L200 382 A9 11 0 0 1 218 382 L218 410 Z"/>
      <path d="M280 410 L280 382 A9 11 0 0 1 298 382 L298 410 Z"/>
      <path d="M470 410 L470 382 A9 11 0 0 1 488 382 L488 410 Z"/>
      <path d="M550 410 L550 382 A9 11 0 0 1 568 382 L568 410 Z"/>
      <path d="M385 410 L385 365 A15 18 0 0 1 415 365 L415 410 Z"/>
    </g>
  </g>

  <!-- ground, reflections and arabesque band -->
  <rect x="0" y="410" width="800" height="70" fill="#061B17"/>
  <g fill="#A7F3D0" opacity=".18">
    <rect x="200" y="412" width="18" height="26"/><rect x="280" y="412" width="18" height="26"/>
    <rect x="385" y="412" width="30" height="30"/><rect x="470" y="412" width="18" height="26"/>
    <rect x="550" y="412" width="18" height="26"/>
  </g>
  <rect x="0" y="440" width="800" height="40" fill="url(#diaryGeo)" opacity=".55"/>
</svg>
