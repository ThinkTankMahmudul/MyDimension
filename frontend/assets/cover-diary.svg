<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Astronaut floating under a crescent moon beside a ringed planet at night">
  <defs>
    <linearGradient id="diarySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2530"/>
      <stop offset=".55" stop-color="#0F4C5C"/>
      <stop offset="1" stop-color="#146B5E"/>
    </linearGradient>
    <radialGradient id="diaryMoonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="diaryGeo" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 6 L29 19 L42 24 L29 29 L24 42 L19 29 L6 24 L19 19 Z" fill="none" stroke="#14B8A6" stroke-opacity=".35" stroke-width="1.5"/>
      <circle cx="24" cy="24" r="4" fill="none" stroke="#14B8A6" stroke-opacity=".3" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#diarySky)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="40" r="1.5"/><circle cx="200" cy="80" r="2.5"/>
    <circle cx="280" cy="50" r="1.5"/><circle cx="360" cy="70" r="2"/><circle cx="470" cy="45" r="2.5"/>
    <circle cx="540" cy="90" r="1.5"/><circle cx="700" cy="140" r="2"/><circle cx="750" cy="60" r="2.5"/>
    <circle cx="90" cy="140" r="1.5"/><circle cx="320" cy="120" r="1.8"/><circle cx="580" cy="60" r="1.5"/>
    <circle cx="680" cy="200" r="1.8"/><circle cx="40" cy="220" r="1.5"/><circle cx="760" cy="260" r="1.5"/>
  </g>
  <g fill="#A7F3D0">
    <path transform="translate(150 110)" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/>
    <path transform="translate(430 60)" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/>
    <path transform="translate(590 150)" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
  </g>

  <!-- crescent moon -->
  <circle cx="640" cy="95" r="62" fill="url(#diaryMoonGlow)"/>
  <circle cx="640" cy="95" r="40" fill="#A7F3D0"/>
  <circle cx="656" cy="82" r="34" fill="#0D3D4C"/>

  <!-- soft clouds -->
  <g fill="#CFE8DC">
    <ellipse cx="150" cy="150" rx="70" ry="14" opacity=".07"/>
    <ellipse cx="520" cy="120" rx="80" ry="16" opacity=".06"/>
    <ellipse cx="350" cy="200" rx="60" ry="12" opacity=".05"/>
  </g>

  <!-- ringed planet -->
  <g>
    <circle cx="620" cy="330" r="58" fill="#14B8A6"/>
    <circle cx="600" cy="312" r="12" fill="#0F766E" opacity=".55"/>
    <circle cx="640" cy="345" r="8" fill="#0F766E" opacity=".45"/>
    <circle cx="628" cy="315" r="5" fill="#A7F3D0" opacity=".7"/>
    <ellipse cx="620" cy="330" rx="92" ry="20" fill="none" stroke="#A7F3D0" stroke-width="7" transform="rotate(-14 620 330)"/>
  </g>

  <!-- floating astronaut -->
  <g>
    <!-- tether -->
    <path d="M300 300 Q220 340 180 300" fill="none" stroke="#A7F3D0" stroke-width="3" stroke-dasharray="8 7" opacity=".7"/>
    <!-- legs -->
    <rect x="292" y="300" width="22" height="52" rx="10" fill="#EDE9FE"/>
    <rect x="322" y="300" width="22" height="52" rx="10" fill="#EDE9FE"/>
    <rect x="288" y="344" width="30" height="14" rx="6" fill="#AFA0E8"/>
    <rect x="318" y="344" width="30" height="14" rx="6" fill="#AFA0E8"/>
    <!-- body + backpack -->
    <rect x="282" y="238" width="72" height="72" rx="24" fill="#FFFFFF"/>
    <rect x="262" y="248" width="24" height="52" rx="10" fill="#AFA0E8"/>
    <rect x="296" y="262" width="44" height="20" rx="8" fill="#E4FAF5"/>
    <circle cx="318" cy="272" r="5" fill="#14B8A6"/>
    <circle cx="334" cy="272" r="5" fill="#AFA0E8"/>
    <!-- arms -->
    <rect x="248" y="252" width="36" height="18" rx="9" fill="#FFFFFF" transform="rotate(-24 248 252)"/>
    <rect x="352" y="250" width="36" height="18" rx="9" fill="#FFFFFF" transform="rotate(20 352 250)"/>
    <!-- helmet + visor -->
    <circle cx="318" cy="204" r="40" fill="#FFFFFF"/>
    <ellipse cx="318" cy="206" rx="26" ry="22" fill="#0F766E"/>
    <ellipse cx="310" cy="198" rx="8" ry="5" fill="#A7F3D0" opacity=".8"/>
    <circle cx="282" cy="184" r="6" fill="#14B8A6"/>
  </g>

  <!-- rolling hills -->
  <path d="M0 400 Q200 350 400 392 T800 380 V480 H0 Z" fill="#0A2E2A"/>
  <path d="M0 436 Q260 396 520 424 T800 416 V480 H0 Z" fill="#061B17"/>

  <!-- open book resting on the hill -->
  <g>
    <path d="M120 420 Q160 402 200 420 V448 Q160 430 120 448 Z" fill="#FFFFFF"/>
    <path d="M200 420 Q240 402 280 420 V448 Q240 430 200 448 Z" fill="#EDE9FE"/>
    <line x1="200" y1="420" x2="200" y2="448" stroke="#0F766E" stroke-width="2"/>
    <g stroke="#14B8A6" stroke-width="2" stroke-linecap="round">
      <line x1="132" y1="424" x2="188" y2="424"/><line x1="136" y1="434" x2="184" y2="434"/>
      <line x1="212" y1="424" x2="268" y2="424"/><line x1="216" y1="434" x2="264" y2="434"/>
    </g>
  </g>

  <rect x="0" y="440" width="800" height="40" fill="url(#diaryGeo)" opacity=".55"/>
</svg>
