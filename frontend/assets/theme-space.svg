<svg xmlns="http://www.w3.org/2000/svg" width="320" height="640" viewBox="-16 -16 352 672" preserveAspectRatio="xMidYMid meet" role="img" aria-label="An astronaut sitting on a chair gazing at a ringed planet">
  <!-- MyDimension palette only: teal, mint, lavender, sand, charcoal.
       Echoes the login-page logo: an astronaut on a chair gazing at a globe. -->
  <!-- Stars -->
  <g fill="#0F766E">
    <circle cx="50" cy="70" r="2.5"/><circle cx="110" cy="40" r="2"/><circle cx="180" cy="90" r="2.5"/>
    <circle cx="290" cy="50" r="2"/><circle cx="40" cy="180" r="2"/><circle cx="300" cy="200" r="2.5"/>
    <path d="M150 130l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path d="M260 260l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
  </g>
  <!-- Ringed planet -->
  <g>
    <circle cx="228" cy="150" r="52" fill="#14B8A6"/>
    <circle cx="210" cy="136" r="10" fill="#0F766E" opacity=".45"/>
    <circle cx="244" cy="166" r="7" fill="#0F766E" opacity=".45"/>
    <ellipse cx="228" cy="150" rx="88" ry="20" fill="none" stroke="#0F766E" stroke-width="7" transform="rotate(-18 228 150)"/>
  </g>
  <!-- Small moon -->
  <circle cx="70" cy="250" r="18" fill="#EDE9FE" stroke="#AFA0E8" stroke-width="3"/>
  <circle cx="64" cy="246" r="4" fill="#AFA0E8"/><circle cx="76" cy="256" r="3" fill="#AFA0E8"/>
  <!-- Ground hill -->
  <path d="M0 560 Q 80 524 160 560 T 320 560 V 640 H 0 Z" fill="#A7F3D0"/>
  <path d="M0 596 Q 90 566 180 596 T 320 596 V 640 H 0 Z" fill="#6EE7B7"/>
  <!-- Chair -->
  <g stroke="#0F766E" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M96 470v-72"/>
    <path d="M96 398h64"/>
    <path d="M160 398v72"/>
    <path d="M96 470h76"/>
    <path d="M104 470l-10 78M152 470l10 78"/>
  </g>
  <!-- Seated astronaut, gazing up at the planet -->
  <g>
    <!-- legs stretched forward -->
    <rect x="128" y="452" width="66" height="20" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <rect x="128" y="476" width="66" height="20" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <!-- boots -->
    <rect x="188" y="448" width="18" height="26" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="3"/>
    <rect x="188" y="474" width="18" height="26" rx="6" fill="#14B8A6" stroke="#0F766E" stroke-width="3"/>
    <!-- torso -->
    <rect x="92" y="398" width="58" height="66" rx="20" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <rect x="104" y="418" width="34" height="20" rx="6" fill="#A7F3D0"/>
    <!-- arm resting on knee -->
    <rect x="128" y="410" width="52" height="16" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="4" transform="rotate(18 128 410)"/>
    <!-- helmet -->
    <circle cx="118" cy="366" r="32" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <ellipse cx="128" cy="366" rx="20" ry="16" fill="#BFDBFE" stroke="#0F766E" stroke-width="3"/>
    <circle cx="134" cy="360" r="4" fill="#FFFFFF"/>
    <!-- backpack -->
    <rect x="76" y="404" width="18" height="44" rx="8" fill="#14B8A6" stroke="#0F766E" stroke-width="3"/>
  </g>
</svg>
